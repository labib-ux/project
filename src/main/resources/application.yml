spring:
  application:
    name: nagorik-seba
  datasource:
    # Local PostgreSQL + PostGIS (docker run postgis/postgis:16-3.4 -p 5432:5432)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nagorik_seba}
    username: ${SPRING_DATASOURCE_USERNAME:nagorik}
    password: ${SPRING_DATASOURCE_PASSWORD:nagorik}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Dhaka
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  error:
    include-message: never

security:
  jwt:
    # Set JWT_SECRET to a unique Base64-encoded key before deploying.
    secret: ${JWT_SECRET:bWFrZS1zdXJlLXRvLXJlcGxhY2UtdGhpcy1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LWJlZm9yZS1kZXBsb3ltZW50LTIwMjY=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    issuer: ${JWT_ISSUER:nagorik-seba}

app:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-photos-per-complaint: ${MAX_PHOTOS_PER_COMPLAINT:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized