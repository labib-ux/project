<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<head th:fragment="head (title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Nagorik Seba'">Nagorik Seba · Transparent Civic Infrastructure</title>

    <!-- Google Fonts: Public Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Tailwind CSS with Forms & Container Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#004ac6",
                        "primary-container": "#2563eb",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "secondary": "#565e74",
                        "secondary-container": "#dae2fd",
                        "on-secondary": "#ffffff",
                        "surface": "#faf8ff",
                        "surface-dim": "#d2d9f4",
                        "surface-bright": "#faf8ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "surface-container": "#eaedff",
                        "surface-container-high": "#e2e7ff",
                        "surface-container-highest": "#dae2fd",
                        "on-surface": "#131b2e",
                        "on-surface-variant": "#434655",
                        "outline": "#737686",
                        "outline-variant": "#c3c6d7",
                        "inverse-surface": "#283044",
                        "inverse-on-surface": "#eef0ff",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "background": "#faf8ff",
                        "on-background": "#131b2e"
                    },
                    fontFamily: {
                        "sans": ["Public Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                        "headline-sm": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "data-mono-sm": ["JetBrains Mono"],
                        "data-mono-md": ["JetBrains Mono"],
                        "data-mono-lg": ["JetBrains Mono"]
                    }
                }
            }
        };
    </script>

    <!-- Base Application CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

    <!-- Shared App JS -->
    <script th:src="@{/js/app.js}" defer></script>

    <th:block th:replace="~{fragments/csp-nonce :: csp-nonce}" />
</head>

</html>
