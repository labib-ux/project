<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('My Complaints')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">My Complaints</h1>
            <p class="text-muted mb-0" id="dashboardSummary">Loading…</p>
        </div>
        <a th:href="@{/citizen/complaints/new}" class="btn btn-primary">New Complaint</a>
    </div>

    <div class="row mb-4" id="statCards"></div>

    <div class="mb-3" id="filterTabs" role="tablist" aria-label="Filter complaints">
        <button class="btn btn-sm btn-primary" data-filter="ALL" role="tab">All</button>
        <button class="btn btn-sm btn-outline-primary" data-filter="ACTIVE" role="tab">Active</button>
        <button class="btn btn-sm btn-outline-primary" data-filter="RESOLVED" role="tab">Resolved</button>
    </div>

    <div id="emptyState" class="text-center py-5" hidden>
        <h4 class="text-muted">No complaints yet</h4>
        <p class="text-muted">Submit your first complaint to get started.</p>
        <a th:href="@{/citizen/complaints/new}" class="btn btn-primary">Submit Complaint</a>
    </div>

    <div id="complaintList"></div>
</div>

<a th:href="@{/citizen/complaints/new}" class="fab" aria-label="Report a new issue">+</a>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/citizen-dashboard.js}"></script>
</body>
</html>
