<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/head :: head('My Complaints')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Complaints</h1>
        <a th:href="@{/citizen/complaint-form}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>New Complaint
        </a>
    </div>

    <div class="row" th:if="${complaints.isEmpty()}">
        <div class="col-12">
            <div class="text-center py-5">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No complaints yet</h4>
                <p class="text-muted">Submit your first complaint to get started</p>
                <a th:href="@{/citizen/complaint-form}" class="btn btn-primary">Submit Complaint</a>
            </div>
        </div>
    </div>

    <div class="row" th:unless="${complaints.isEmpty()}">
        <div class="col-12">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Reference</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="complaint : ${complaints}">
                            <td>
                                <code th:text="${complaint.referenceCode}">NS-2026-000001</code>
                            </td>
                            <td th:text="${complaint.title}">Complaint title</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${complaint.category}">ROADS</span>
                            </td>
                            <td>
                                <span th:class="${complaint.status} == 'SUBMITTED' ? 'badge bg-info' : 
                                              ${complaint.status} == 'VERIFIED' ? 'badge bg-primary' :
                                              ${complaint.status} == 'ASSIGNED' ? 'badge bg-warning text-dark' :
                                              ${complaint.status} == 'IN_PROGRESS' ? 'badge bg-info' :
                                              ${complaint.status} == 'RESOLVED' ? 'badge bg-success' :
                                              ${complaint.status} == 'CLOSED' ? 'badge bg-secondary' :
                                              ${complaint.status} == 'REOPENED' ? 'badge bg-warning text-dark' :
                                              ${complaint.status} == 'REJECTED' ? 'badge bg-danger' :
                                              ${complaint.status} == 'CANCELLED' ? 'badge bg-dark' : 'badge bg-secondary'"
                                     th:text="${complaint.status}">SUBMITTED</span>
                            </td>
                            <td th:text="${#temporals.format(complaint.submittedAt, 'dd MMM yyyy HH:mm')}">01 Jan 2026 10:00</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/api/complaints/{ref}(ref=${complaint.referenceCode})}" 
                                       class="btn btn-outline-primary" target="_blank">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:href="@{/citizen/complaint-detail/{ref}(ref=${complaint.referenceCode})}" 
                                       class="btn btn-outline-secondary">
                                        <i class="fas fa-history"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
