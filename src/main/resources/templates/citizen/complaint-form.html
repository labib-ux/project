<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/head :: head('Submit Complaint')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Submit New Complaint</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/api/complaints}" method="post" enctype="multipart/form-data" id="complaintForm">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" required maxlength="200"
                                   placeholder="Brief description of the issue">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description" rows="4" required maxlength="5000"
                                      placeholder="Describe the issue in detail..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Select a category</option>
                                <option value="ROADS">Roads & Infrastructure</option>
                                <option value="WATER_SUPPLY">Water Supply</option>
                                <option value="ELECTRICITY">Electricity</option>
                                <option value="SANITATION">Sanitation</option>
                                <option value="WATERLOGGING">Waterlogging</option>
                                <option value="MOSQUITO_BREEDING">Mosquito Breeding</option>
                                <option value="WASTE_MANAGEMENT">Waste Management</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location <span class="text-danger">*</span></label>
                            <div id="map" style="height: 300px; border-radius: 8px; border: 1px solid #dee2e6;"></div>
                            <div class="mt-2">
                                <small class="text-muted">Click on the map to set the location</small>
                            </div>
                            <input type="hidden" id="latitude" name="latitude" required>
                            <input type="hidden" id="longitude" name="longitude" required>
                            <div id="wardInfo" class="mt-2 text-muted small"></div>
                        </div>

                        <div class="mb-3">
                            <label for="photos" class="form-label">Photos <span class="text-danger">*</span></label>
                            <input type="file" class="form-control" id="photos" name="photos" accept="image/*" multiple required>
                            <div class="form-text">Upload up to 5 photos (JPEG, PNG, WebP, max 10MB each)</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/citizen/dashboard}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Submit Complaint</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Map Picker JS -->
<script th:src="@{/js/map-picker.js}"></script>
</body>
</html>
