<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Complaint Details')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4" id="detail" data-ref="">
    <h2 id="title">Complaint</h2>
    <p class="text-muted" id="meta"></p>

    <h4>Status timeline</h4>
    <ul class="list-group mb-4" id="timeline"></ul>

    <h4>Photos</h4>
    <div class="row mb-4" id="gallery"></div>
    <div class="lightbox hidden" id="lightbox" role="dialog" aria-label="Photo viewer">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close viewer">&times;</button>
        <img id="lightboxImg" alt="complaint photo enlarged">
    </div>

    <div class="row">
        <div class="col-md-4">
            <h4>Rate the resolution</h4>
            <form id="rateForm">
                <div class="mb-2">
                    <label for="rating" class="form-label">Rating (1–5)</label>
                    <input type="number" class="form-control" id="rating" min="1" max="5" required>
                </div>
                <div class="mb-2">
                    <label for="feedback" class="form-label">Feedback</label>
                    <textarea class="form-control" id="feedback" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit rating</button>
            </form>
        </div>
        <div class="col-md-4">
            <h4>Reopen</h4>
            <form id="reopenForm">
                <div class="mb-2">
                    <label for="reason" class="form-label">Reason</label>
                    <textarea class="form-control" id="reason" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-warning">Reopen complaint</button>
            </form>
        </div>
        <div class="col-md-4">
            <h4>Withdraw</h4>
            <p class="text-muted small">Only while SUBMITTED or VERIFIED. This hides the report from the public map.</p>
            <form id="cancelForm">
                <div class="mb-2">
                    <label for="cancelReason" class="form-label">Reason</label>
                    <textarea class="form-control" id="cancelReason" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-outline-danger">Withdraw complaint</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/timeline.js}"></script>
<script>
(function () {
    var App = window.NagorikSeba;
    if (!App || !App.getToken()) {
        window.location.replace('/login?next=' + encodeURIComponent(window.location.pathname));
        return;
    }
    function ref() {
        var segments = window.location.pathname.split('/').filter(Boolean);
        if (segments.length >= 3 && segments[0] === 'citizen' && segments[1] === 'complaints') {
            return decodeURIComponent(segments[2]);
        }
        return new URLSearchParams(window.location.search).get('ref');
    }
    async function submitRate(event) {
        event.preventDefault();
        try {
            await App.apiJson('/api/complaints/' + encodeURIComponent(ref()) + '/rate?rating='
                + encodeURIComponent(document.getElementById('rating').value)
                + '&feedback=' + encodeURIComponent(document.getElementById('feedback').value),
                {method: 'POST', headers: {'Idempotency-Key': idempotencyKey()}});
            App.toast('Thanks for rating!', 'success');
            loadDetail();
        } catch (error) {
            App.toast(error.message, 'error');
        }
    }
    async function submitReopen(event) {
        event.preventDefault();
        try {
            await App.apiJson('/api/complaints/' + encodeURIComponent(ref()) + '/reopen?reason='
                + encodeURIComponent(document.getElementById('reason').value),
                {method: 'POST', headers: {'Idempotency-Key': idempotencyKey()}});
            App.toast('Complaint reopened.', 'success');
            loadDetail();
        } catch (error) {
            App.toast(error.message, 'error');
        }
    }
    function idempotencyKey() {
        try {
            return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
        } catch (e) {
            return String(Date.now());
        }
    }
    async function submitCancel(event) {
        event.preventDefault();
        if (!confirm('Withdraw this complaint? This cannot be undone.')) return;
        try {
            await App.apiJson('/api/complaints/' + encodeURIComponent(ref()) + '/cancel?reason='
                + encodeURIComponent(document.getElementById('cancelReason').value),
                {method: 'POST', headers: {'Idempotency-Key': idempotencyKey()}});
            App.toast('Complaint withdrawn.', 'success');
            loadDetail();
        } catch (error) {
            App.toast(error.message, 'error');
        }
    }
    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').classList.remove('hidden');
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.add('hidden');
        document.getElementById('lightboxImg').removeAttribute('src');
    }
    document.getElementById('rateForm').addEventListener('submit', submitRate);
    document.getElementById('reopenForm').addEventListener('submit', submitReopen);
    document.getElementById('cancelForm').addEventListener('submit', submitCancel);
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', function (event) {
        if (event.target.id === 'lightbox') closeLightbox();
    });
    document.getElementById('gallery').addEventListener('click', function (event) {
        var img = event.target.closest('img');
        if (img) openLightbox(img.src);
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeLightbox();
    });
    loadDetail();
})();
</script>
</body>
</html>
