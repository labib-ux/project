<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('User Admin')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h2>User administration</h2>
    <p class="text-muted">Activate/deactivate accounts, post memberships, and anonymize deleted users.</p>

    <button class="btn btn-primary mb-3" id="createOpen">Add citizen / posting</button>

    <table class="table table-striped" id="userTable">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<div class="slide-in-backdrop hidden" id="createBackdrop"></div>
<aside class="slide-in" id="createPanel" aria-label="Add citizen">
    <h4>Add citizen</h4>
    <p class="text-muted">Registers the account, then posts the municipality membership. Officer and councilor roles are assigned through a separate privileged process.</p>
    <div class="mb-2">
        <label for="newName" class="form-label">Full name</label>
        <input class="form-control" id="newName" maxlength="120" required>
    </div>
    <div class="mb-2">
        <label for="newEmail" class="form-label">Email</label>
        <input class="form-control" id="newEmail" type="email" maxlength="120" required>
    </div>
    <div class="mb-2">
        <label for="newPhone" class="form-label">Mobile number</label>
        <input class="form-control" id="newPhone" placeholder="01712345678" required>
    </div>
    <div class="mb-2">
        <label for="newMunicipality" class="form-label">Municipality</label>
        <select class="form-select" id="newMunicipality"></select>
    </div>
    <p id="createFeedback" class="text-danger"></p>
    <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-secondary" id="createCancel">Cancel</button>
        <button class="btn btn-primary" id="createConfirm">Create</button>
    </div>
</aside>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/admin-users.js}"></script>
</body>
</html>
