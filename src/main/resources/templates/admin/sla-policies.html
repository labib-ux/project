<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('SLA Policy Admin')}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h2>SLA policy administration</h2>
    <p class="text-muted">Edits apply to subsequently calculated deadlines only — existing instances keep their snapshots.</p>

    <div class="row g-2 mb-3">
        <div class="col-md-3">
            <label for="municipalityId" class="form-label">Municipality ID (blank = all)</label>
            <input type="number" class="form-control" id="municipalityId">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary" id="loadBtn">Load</button>
        </div>
    </div>

    <table class="table table-striped" id="policyTable">
        <thead><tr><th>ID</th><th>Category</th><th>Priority</th><th>Max h</th><th>L1 h</th><th>L2 h</th><th>Active</th><th></th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/admin-sla-policies.js}"></script>
</body>
</html>
